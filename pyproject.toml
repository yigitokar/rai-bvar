[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rai-bvar"
version = "0.2.0"
description = "Ablation-ready Bayesian VARs: composable mean, volatility and prior components with a fair out-of-sample verdict engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.15",
    "pandas>=2.2",
    "xarray>=2024.10",
    "scoringrules>=0.11",
    "jax>=0.12",  # MCMC engine (float64 enabled on import; SPEC §8)
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# Phase 4 week-1 spike only (docs/phase4/SPIKE.md): the prototype BART mean block, pinned
bart = ["bartz==0.13.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "bvar>=0.3.5",  # Bank of England BVAR: Python-side parity oracle (SPEC §10.4, D5)
]

[tool.hatch.build.targets.wheel]
packages = ["src/rai_bvar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running statistical tests (weekly tier)",
    "network: downloads data from the internet (weekly tier)",
    "geweke: Geweke joint-distribution tests of the MCMC engine (docs/phase2/DESIGN.md §9.5)",
    "sbc: simulation-based calibration of the MCMC engine (DESIGN §9.6; weekly tier)",
    "mutation: mutation suite, every mutant must fail some tier (DESIGN §9.7; weekly)",
    "bench: performance benchmarks such as BENCH-P2 (DESIGN §10; pre-release)",
    "parity_long: long parity runs against R oracles (DESIGN §9.9; weekly tier)",
    "weekly: weekly-tier tests (DESIGN §9.10)",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in SPEC.md / README.md are illustrative sketches, not formatted source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
# Greek letters in math docstrings are intentional; line length is left to the formatter.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["rai_bvar.evaluation.backtest.Expanding"]
