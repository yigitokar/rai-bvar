name: CI

on:
  push:
    branches: [main]  # branches with a PR run once, through pull_request
  pull_request:
  schedule:
    - cron: "17 3 * * 0"  # weekly (Sunday): slow statistical tests and network downloads
  workflow_dispatch:
    inputs:
      bench:
        description: "Run only the BENCH-P2 pre-release benchmark (DESIGN §9.10, §10) instead of the weekly jobs"
        type: boolean
        default: false
      r_fixtures:
        description: "Run only the R oracle job r-fixtures (Phase 3 DESIGN D-54): parity fixtures as an artifact, no tests"
        type: boolean
        default: false
      r_fixtures_args:
        description: "Extra arguments for tools/make_r_fixtures.R in r-fixtures (e.g. --quick or --only=GLOB)"
        type: string
        default: ""

concurrency:
  # the event is part of the group: a merge to main must not cancel the hours-long weekly run (or
  # a manual bench run) on the same ref; a new push to a PR still cancels that PR's older run. The
  # bench and r_fixtures inputs are too, so bench, R-fixture and weekly dispatches on one ref run
  # side by side.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.bench }}-${{ inputs.r_fixtures }}
  cancel-in-progress: true

env:
  # the weekly tier (jobs nightly-plan and nightly); bench (BENCH-P2, timing gates) is pre-release
  # only: never in the weekly tier
  TIER_MARKERS: "(slow or network) and not bench"

jobs:
  # lint and test run on every push and pull request; on a dispatch they stay out of an
  # r_fixtures run, which runs nothing but the r-fixtures job
  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.r_fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.r_fixtures
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      # Persistent XLA compilation cache (DESIGN §9.10 budgets the PR tier with it). A hit loads the
      # executable the same program compiles to, so it changes no result. Key = stable prefix
      # xla-<os>-py<ver>-<isa>-<uv.lock>- plus a per-run suffix; restore-keys = the prefix, so a run
      # restores the newest entry of its bucket from its own ref, else from its PR base or main.
      # <isa> = md5 of the /proc/cpuinfo "model name" and "flags" lines, one bucket per runner CPU
      # (the pool mixes AMD EPYC 7763/9V74/9V45 and Intel Xeon 8370C/8573C). JAX's own key (jax
      # 0.12.0.1) hashes XLA_FLAGS and the CPU topology: the target CPU name and the host's whole
      # feature list. An entry is only served to a runner with the same features, so a bucket shared
      # by CPU models would gain no hits, only size; an ISA cap (--xla_cpu_max_isa) does not change
      # that and was reverted (DESIGN §9.10, 2026-10-24). py stays in the key: JAX 0.12 compresses
      # entries with zstd on 3.14 and zlib on 3.12/3.13 under the same JAX key.
      - name: XLA cache key
        id: xla
        run: |
          isa=$({ grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo; } | md5sum | cut -c1-12)
          echo "runner: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'), $(nproc) vCPU, ISA $isa, XLA_FLAGS ${XLA_FLAGS:-none}"
          echo "isa=$isa" >> "$GITHUB_OUTPUT"
          echo "prefix=xla-${RUNNER_OS}-py${{ matrix.python-version }}-${isa}-${{ hashFiles('uv.lock') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore XLA cache
        id: xla-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jax-xla
          key: ${{ steps.xla.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.xla.outputs.prefix }}
      # entries are never evicted, so a chain of restores only grows: start over above 1 GiB
      # (a cold fast suite writes about 0.25 GiB; the repository's cache quota is 10 GB)
      - name: XLA cache size check
        run: |
          dir="$RUNNER_TEMP/jax-xla"
          mkdir -p "$dir"
          if [ "$(du -sm "$dir" | cut -f1)" -gt 1024 ]; then
            echo "restored XLA cache exceeds 1 GiB: starting from an empty cache"
            rm -rf "$dir" && mkdir -p "$dir"
          fi
          echo "XLA_ENTRIES_BEFORE=$(find "$dir" -type f | wc -l)" >> "$GITHUB_ENV"
      - name: Fast suite (unit, contract, integration)
        env:
          JAX_COMPILATION_CACHE_DIR: ${{ runner.temp }}/jax-xla
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
        run: |
          start=$(date +%s)
          status=0
          uv run pytest -m "not slow and not network and not bench" --durations=30 || status=$?
          echo "PYTEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit "$status"
      # the measurement behind the PR-tier budget (DESIGN §9.10): hit or miss, entries reused, time
      - name: XLA cache report
        id: xla-report
        if: always()
        env:
          MATCHED: ${{ steps.xla-restore.outputs.cache-matched-key }}
          ISA: ${{ steps.xla.outputs.isa }}
        run: |
          added=$(( $(find "$RUNNER_TEMP/jax-xla" -type f | wc -l) - ${XLA_ENTRIES_BEFORE:-0} ))
          echo "added=$added" >> "$GITHUB_OUTPUT"
          {
            echo "### XLA cache, Python ${{ matrix.python-version }}"
            echo "- runner: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'), $(nproc) vCPU"
            echo "- ISA bucket: ${ISA:-unknown}; XLA_FLAGS: ${XLA_FLAGS:-none}"
            echo "- restored: ${MATCHED:-nothing (cold run)}"
            echo "- entries restored: ${XLA_ENTRIES_BEFORE:-0}; written by this run: $added"
            echo "- fast suite wall time: ${PYTEST_SECONDS:-not measured} s"
          } >> "$GITHUB_STEP_SUMMARY"
      # saved only when this run compiled something new (a clean hit would duplicate its entry and
      # spend quota that evicts main's entries); a cancelled or failed run still saves its work
      - name: Save XLA cache
        if: always() && steps.xla-report.outputs.added != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jax-xla
          key: ${{ steps.xla.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  macos:  # weekly: macOS minutes bill at 10x; local development runs on macOS anyway
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.bench && !inputs.r_fixtures)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Fast suite (unit, contract, integration)
        run: uv run pytest -m "not slow and not network and not bench"

  # The weekly tier runs as shards (tools/weekly_shards.py: a split directory is `-k E` and
  # `-k "not E"` on one path, the rest is the suite minus those directories): one job did not finish
  # within GitHub's 6 h job limit (run 40052069815: timed out at 330 min, 53% done, EPYC 7763 with
  # 2 vCPU). The plan job checks with `pytest --collect-only` that the shards partition the tier
  # (every test in exactly one shard) before any shard starts, and hands their arguments on.
  nightly-plan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.bench && !inputs.r_fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Shards partition the tier
        id: plan
        run: uv run python -I tools/weekly_shards.py check --markers "$TIER_MARKERS" --github-output "$GITHUB_OUTPUT"

  nightly:  # weekly despite the name (DESIGN §9.10 nightly + weekly tiers, run together)
    needs: nightly-plan
    name: nightly (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Budget per shard: 40-56 min on an EPYC 9V45 (4 vCPU, run 40106532730); the EPYC 7763 (2 vCPU)
    # takes 2-3x as long, and a CPU-dependent Gandy-Scott rerun adds up to an hour (geweke shards:
    # 160 and 113 min there, summed from run 40052069815's per-row times; 120 and 82 min on a 4-vCPU
    # 7763 in run 40140397848).
    timeout-minutes: 270
    strategy:
      fail-fast: false  # one failing shard must not cancel the others' records
      matrix: ${{ fromJSON(needs.nightly-plan.outputs.matrix) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_ARGS: ${{ toJSON(matrix.args) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # Same persistent XLA compilation cache and <isa> rule as the fast suite (own prefix per shard:
      # different programs, and concurrent shards cannot save under one key).
      - name: XLA cache key
        id: xla
        run: |
          isa=$({ grep -m1 '^model name' /proc/cpuinfo; grep -m1 '^flags' /proc/cpuinfo; } | md5sum | cut -c1-12)
          echo "runner: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'), $(nproc) vCPU, ISA $isa, XLA_FLAGS ${XLA_FLAGS:-none}"
          echo "prefix=xla-slow-${SHARD}-${RUNNER_OS}-py3.12-${isa}-${{ hashFiles('uv.lock') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore XLA cache
        id: xla-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jax-xla
          key: ${{ steps.xla.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.xla.outputs.prefix }}
      - name: XLA cache size check
        run: |
          dir="$RUNNER_TEMP/jax-xla"
          mkdir -p "$dir"
          if [ "$(du -sm "$dir" | cut -f1)" -gt 1024 ]; then
            echo "restored XLA cache exceeds 1 GiB: starting from an empty cache"
            rm -rf "$dir" && mkdir -p "$dir"
          fi
          echo "XLA_ENTRIES_BEFORE=$(find "$dir" -type f | wc -l)" >> "$GITHUB_ENV"
      # Validation record (geweke.jsonl, sbc.jsonl, mutation.jsonl, ...: the tests append one JSON
      # line per run to $RAI_BVAR_VALIDATION_RECORD/<kind>.jsonl), uploaded as an artifact so the
      # results can be committed; meta.json names the commit, run, runner, versions and XLA_FLAGS
      # they belong to.
      - name: Validation record metadata
        env:
          RAI_BVAR_VALIDATION_RECORD: ${{ runner.temp }}/validation-record
        run: |
          mkdir -p "$RAI_BVAR_VALIDATION_RECORD"
          uv run python - <<'EOF'
          import datetime
          import json
          import os
          import platform
          from importlib.metadata import version

          env = os.environ
          cpu = next(
              (line.split(":", 1)[1].strip() for line in open("/proc/cpuinfo") if line.startswith("model name")),
              platform.processor(),
          )
          meta = {
              "commit": env["GITHUB_SHA"],
              "ref": env["GITHUB_REF"],
              "event": env["GITHUB_EVENT_NAME"],
              "run": f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}",
              "run_attempt": int(env["GITHUB_RUN_ATTEMPT"]),
              "started_utc": datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds"),
              "markers": env["TIER_MARKERS"],
              "shard": env["SHARD"],
              "shard_args": json.loads(env["SHARD_ARGS"]),
              "runner": {"platform": platform.platform(), "cpu": cpu, "logical_cpus": os.cpu_count()},
              "python": platform.python_version(),
              "versions": {p: version(p) for p in ("jax", "jaxlib", "numpy", "scipy")},
              "rai_bvar_env": {k: env[k] for k in sorted(env) if k.startswith("RAI_BVAR_")},
              "xla_flags": env.get("XLA_FLAGS", ""),
          }
          with open(os.path.join(env["RAI_BVAR_VALIDATION_RECORD"], "meta.json"), "w") as fh:
              json.dump(meta, fh, indent=1)
              fh.write("\n")
          print(json.dumps(meta, indent=1))
          EOF
      # the step timeout leaves the job time to upload the record and save the cache (the jsonl
      # lines are appended per test, so a run cut short still records every finished row)
      - name: Slow and network tests
        timeout-minutes: 240
        env:
          JAX_COMPILATION_CACHE_DIR: ${{ runner.temp }}/jax-xla
          JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS: "0"
          RAI_BVAR_VALIDATION_RECORD: ${{ runner.temp }}/validation-record
        run: |
          mapfile -t args < <(jq -r '.[]' <<< "$SHARD_ARGS")
          start=$(date +%s)
          status=0
          uv run pytest -m "$TIER_MARKERS" "${args[@]}" --durations=30 --junitxml="$RAI_BVAR_VALIDATION_RECORD/junit.xml" || status=$?
          echo "PYTEST_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit "$status"
      - name: Upload validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-record-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/validation-record
          if-no-files-found: warn
          retention-days: 90
      # the measurement behind the shard budget: runner, cache entries and pytest wall time
      - name: XLA cache report
        id: xla-report
        if: always()
        env:
          MATCHED: ${{ steps.xla-restore.outputs.cache-matched-key }}
        run: |
          added=$(( $(find "$RUNNER_TEMP/jax-xla" -type f | wc -l) - ${XLA_ENTRIES_BEFORE:-0} ))
          echo "added=$added" >> "$GITHUB_OUTPUT"
          {
            echo "### Weekly shard $SHARD"
            echo "- selection: \`-m \"$TIER_MARKERS\" $(jq -r 'join(" ")' <<< "$SHARD_ARGS")\`"
            echo "- runner: $(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//'), $(nproc) vCPU"
            echo "- XLA cache restored: ${MATCHED:-nothing (cold run)}; entries restored ${XLA_ENTRIES_BEFORE:-0}, written $added"
            echo "- pytest wall time: ${PYTEST_SECONDS:-not measured (step cut short)} s"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save XLA cache
        if: always() && steps.xla-report.outputs.added != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jax-xla
          key: ${{ steps.xla.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

  # the whole weekly record in one artifact, one directory per shard (both geweke shards write a
  # geweke.jsonl, both sbc shards an sbc.jsonl, and every shard its own meta.json and junit.xml)
  nightly-record:
    needs: [nightly-plan, nightly]
    if: always() && needs.nightly-plan.result == 'success' && !inputs.r_fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: validation-record-${{ github.sha }}-${{ github.run_attempt }}
          pattern: validation-record-${{ github.sha }}-${{ github.run_attempt }}-*
          separate-directories: true
          retention-days: 90

  bench:  # pre-release tier (DESIGN §9.10): manual only (Actions > CI > Run workflow > bench)
    if: github.event_name == 'workflow_dispatch' && inputs.bench && !inputs.r_fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      # A shared cloud runner is not the reference laptop: the gate compares only on a machine
      # matching tests/bench/baseline.json and asserts 120 s only on the reference machine.
      - name: BENCH-P2 and kernel microbenchmarks
        run: uv run python benchmarks/phase2_perf.py --kernels --out bench-p2.json
      # the gates: test_perf_phase2 compares only on a machine matching baseline.json; the
      # weighted-path timing test (tests/mcmc) is machine-independent and runs nowhere else
      - name: Bench-marked tests (gates)
        if: always()
        run: uv run pytest -m bench -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-p2
          path: bench-p2.json

  # Phase 3 R oracles (DESIGN D-54, §9.8; work package WP29). Dispatch-only (never on push, pull
  # request or schedule) and no test job: it installs R and the GPL oracle packages (stochvol,
  # bayesianVARs 0.1.8, bvars 1.1 with bsvars) as Linux binaries from one dated Posit Package
  # Manager snapshot, runs tools/make_r_fixtures.R, packs the staged JSON into NetCDF and uploads
  # the fixtures, the layout records and the logs as an artifact, which is downloaded with
  # `gh run download` and committed. Test jobs never install R or touch the network.
  #   gh workflow run ci.yml --ref <branch> -f r_fixtures=true [-f r_fixtures_args=--quick]
  r-fixtures:
    if: github.event_name == 'workflow_dispatch' && inputs.r_fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      R_VERSION: "4.5.3"
      # snapshot dated after bvars 1.1 (2026-09-07); it serves bayesianVARs 0.1.8, bvars 1.1,
      # bsvars 4.0, stochvol 3.2.9, factorstochvol 1.1.2, GIGrvg 0.8, RcppTN 0.2-2
      RAI_BVAR_PPM_SNAPSHOT: "2026-10-20"
      R_FIXTURES_ARGS: ${{ inputs.r_fixtures_args }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "OUT=$RUNNER_TEMP/r-fixtures" >> "$GITHUB_ENV"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: R packages from the pinned snapshot
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          repo="https://packagemanager.posit.co/cran/__linux__/${codename}/${RAI_BVAR_PPM_SNAPSHOT}"
          export RAI_BVAR_PPM_REPO="$repo"
          echo "RAI_BVAR_PPM_REPO=$repo" >> "$GITHUB_ENV"
          mkdir -p "$OUT"
          cat > "$RUNNER_TEMP/install.R" <<'EOF'
          repo <- Sys.getenv("RAI_BVAR_PPM_REPO")
          # Posit Package Manager serves Linux binaries only to this user agent
          options(repos = c(CRAN = repo), HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])))
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          pk <- c("jsonlite", "coda", "mvtnorm", "stochvol", "bayesianVARs", "bvars")
          install.packages(pk, lib = lib, Ncpus = 4L)
          cat(R.version.string, "\n", "repository:", repo, "\n")
          for (p in c(pk, "bsvars", "factorstochvol", "GIGrvg", "RcppArmadillo", "Rcpp",
                      "RcppProgress", "RcppTN", "R6", "generics", "lpSolveAPI")) {
            d <- packageDescription(p)
            cat(sprintf("%s %s (Built: %s; Repository: %s)\n", p, d$Version, d$Built, d$Repository))
          }
          stopifnot(packageVersion("bayesianVARs") == "0.1.8", packageVersion("bvars") == "1.1",
                    packageVersion("stochvol") >= "3.2.5")
          EOF
          set -o pipefail
          Rscript "$RUNNER_TEMP/install.R" 2>&1 | tee "$OUT/install.log"
      - name: R fixtures (stochvol SV-t, bayesianVARs, bvars)
        env:
          RAI_BVAR_CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          read -r -a extra <<< "$R_FIXTURES_ARGS"
          Rscript tools/make_r_fixtures.R --sections=stochvol,bvars,wbvars --sv-only=stochvol_v_t5 \
            --no-swa --staging="$OUT/staging" "${extra[@]}" 2>&1 | tee "$OUT/make_r_fixtures.log"
      - name: Pack into NetCDF
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$OUT/fixtures"
          uv run python -I tools/make_sv_parity_data.py pack "$OUT/staging" --out "$OUT/fixtures" 2>&1 | tee "$OUT/pack.log"
      - name: Upload the fixtures, layout records and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-fixtures-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r-fixtures
          if-no-files-found: warn
          retention-days: 30
